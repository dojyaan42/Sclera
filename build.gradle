plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def visorVersion = project.findProperty('visorVersion') ?: '0.6.0-beta'

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // ModMenu API (optional compile-time dependency)
    modCompileOnly "com.terraformersmc:modmenu:7.2.2"

    // Compile against required and optional mods without bundling them in Sclera.
    modCompileOnly "maven.modrinth:visor:${visorVersion}+mc1.20.1-fabric"
    modCompileOnly "maven.modrinth:visoressentials:0.6.0-alpha.1+mc1.20.1-fabric"
    modCompileOnly "maven.modrinth:iris:1.7.6+1.20.1"

    // WrapMethod must also work on loaders whose bundled MixinExtras predates it.
    include(implementation(annotationProcessor('io.github.llamalad7:mixinextras-fabric:0.4.1')))

    // Minecraft already provides JNA in its runtime libraries.
    compileOnly "net.java.dev.jna:jna:5.14.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
